<!--# title: 05b 编辑项目弹窗 · 方案B -->
<!--# desc: 新建弹窗的编辑态：字段预填、状态与模型已选（模型为规划中字段）、含删除入口 -->
<!--# body: data-nav="workspace" -->
<section class="screen">
  <aside class="col-left">
    <div class="brand">
      <div class="brand__logo">
        <svg width="14" height="14" viewBox="0 0 18 18" fill="none"><path d="M9 2.5 3.2 15.5h11.6L9 2.5Z" fill="#fff" /></svg>
      </div>
      <span class="brand__name">Aura</span>
      <span class="brand__tag">自主体验</span>
    </div>
    <div class="modnav modnav--row">
      <div class="modnav__item" data-key="workspace">工作台</div>
      <div class="modnav__item" data-key="notes">笔记</div>
      <div class="modnav__item" data-key="setting">设置</div>
    </div>
    <div class="divider"></div>
    <div class="group-title">项目</div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4">
        <circle cx="6" cy="6" r="4.2" /><path d="M9.2 9.2 12.5 12.5" stroke-linecap="round" />
      </svg>
      搜索项目
    </div>
    <div class="project-list">
      <div class="project-item project-item--active">
        <span class="project-item__name">品牌官网改版</span>
        <span class="project-item__meta">进行中 · 2 小时前</span>
      </div>
      <div class="project-item">
        <span class="project-item__name">Aura 前端工作台改造</span>
        <span class="project-item__meta">进行中 · 昨天 18:20</span>
      </div>
    </div>
    <div class="user-bar">
      <div class="user-bar__avatar">
        <svg class="nav-icon" viewBox="0 0 18 18" style="width:14px;height:14px;stroke-width:1.6">
          <circle cx="9" cy="6.4" r="3" /><path d="M3.6 15c.6-2.6 2.8-4 5.4-4s4.8 1.4 5.4 4" />
        </svg>
      </div>
      <span class="user-bar__name">yanqing</span>
    </div>
  </aside>

  <main class="main">
    <div class="page-head">
      <div class="page-head__text">
        <span class="t-title">项目工作台</span>
        <span class="t-body t-muted">选一个项目继续推进，或新建一个项目——推进与沉淀都在项目内完成</span>
      </div>
      <button class="btn btn--primary">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round">
          <path d="M7 1.5v11M1.5 7h11" />
        </svg>
        新建项目
      </button>
    </div>
    <div class="stats">
      <div class="stat-card t-success"><span class="stat-card__value">3</span><span class="stat-card__label">进行中</span></div>
      <div class="stat-card t-warning"><span class="stat-card__value">2</span><span class="stat-card__label">暂停</span></div>
      <div class="stat-card t-muted"><span class="stat-card__value">1</span><span class="stat-card__label">已归档</span></div>
      <div class="stat-card t-primary"><span class="stat-card__value">4</span><span class="stat-card__label">本周有推进</span></div>
    </div>
  </main>

  <div class="overlay">
    <div class="modal">
      <div class="auth__intro">
        <span class="t-h2">编辑项目</span>
        <span class="t-sm t-muted">更新目标与状态，改动会同步到项目上下文</span>
      </div>

      <div class="field">
        <span class="field__label">项目名称</span>
        <div class="input input--filled">品牌官网改版</div>
      </div>

      <div class="field">
        <span class="field__label">项目目标</span>
        <div class="input input--filled">三个月内完成官网信息架构与视觉改版</div>
      </div>

      <div class="field">
        <span class="field__label">背景描述</span>
        <div class="textarea">重构首页叙事，统一组件库，建立可维护的内容审核流程。</div>
      </div>

      <div style="display: flex; gap: 12px">
        <div class="field" style="flex: 1 1 0">
          <span class="field__label">当前状态</span>
          <div class="input input--filled" style="justify-content: space-between">
            进行中
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="#6b7785" stroke-width="1.4" stroke-linecap="round"><path d="M3.5 5.5 7 9l3.5-3.5" /></svg>
          </div>
        </div>
        <div class="field" style="flex: 1 1 0">
          <span class="field__label">默认模型 <span class="pill pill--sm pill--info" style="margin-left:4px">规划中</span></span>
          <div class="input input--filled" style="justify-content: space-between">
            GPT-4o
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="#6b7785" stroke-width="1.4" stroke-linecap="round"><path d="M3.5 5.5 7 9l3.5-3.5" /></svg>
          </div>
        </div>
      </div>

      <div class="modal__foot">
        <span class="t-danger t-sm w-medium" style="margin-right: auto; align-self: center">删除项目</span>
        <button class="btn btn--ghost">取消</button>
        <button class="btn btn--primary">保存修改</button>
      </div>
    </div>
  </div>
</section>
