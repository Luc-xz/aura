<!--# title: 15 状态与反馈 · 全局 -->
<!--# desc: 全局规范——状态胶囊 / 按钮与输入态 / 空状态与加载 / 反馈与校验 -->
<!--# body: data-page="states" -->
<section class="screen" style="flex-direction: column; padding: 36px 40px; gap: 24px">
  <div style="display: flex; flex-direction: column; gap: 6px">
    <span class="t-h2">全局状态与反馈规范</span>
    <span class="t-body t-muted">所有界面共用同一套状态色与反馈组件，保证跨模块的一致性</span>
  </div>

  <div style="display: flex; gap: 24px; flex: 1 1 auto">
    <!-- 栏 1：状态胶囊 / 按钮 / 输入框 -->
    <div class="spec-card" style="flex: 1 1 0">
      <span class="spec-card__title">项目状态</span>
      <div style="display: flex; gap: 8px">
        <span class="pill pill--active">进行中</span>
        <span class="pill pill--paused">已暂停</span>
        <span class="pill pill--archived">已归档</span>
      </div>

      <span class="spec-card__title">会话与任务状态</span>
      <div style="display: flex; gap: 8px">
        <span class="pill pill--stream">流式中</span>
        <span class="pill pill--active">已沉淀</span>
        <span class="pill pill--aborted">已中断</span>
      </div>

      <span class="spec-card__title">按钮状态</span>
      <div style="display: flex; gap: 8px">
        <button class="btn btn--primary btn--sm">保存</button>
        <button class="btn btn--ghost btn--sm">取消</button>
        <button class="btn btn--disabled btn--sm">禁用</button>
      </div>

      <span class="spec-card__title">输入框状态</span>
      <div class="input">请输入项目名称</div>
      <div class="input input--focus input--filled">Aura 工作台改版</div>
      <div class="input input--disabled">只读内容</div>
    </div>

    <!-- 栏 2：空状态 / 骨架 / 加载 -->
    <div class="spec-card" style="flex: 1 1 0">
      <span class="spec-card__title">空状态</span>
      <div class="empty" style="padding: 20px">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#b9c4ce" stroke-width="1.6">
          <rect x="6" y="11" width="28" height="21" rx="3" />
          <path d="M6 17h28M14 11V8.5A1.5 1.5 0 0 1 15.5 7h9A1.5 1.5 0 0 1 26 8.5V11" stroke-linecap="round" />
        </svg>
        <span class="empty__title" style="font-size: 14px">还没有项目</span>
        <span class="empty__desc t-sm">创建第一个项目，开始推进与沉淀</span>
        <button class="btn btn--primary btn--sm">新建项目</button>
      </div>

      <span class="spec-card__title">加载骨架屏</span>
      <div class="skeleton-card">
        <div class="skeleton" style="width: 100%"></div>
        <div class="skeleton" style="width: 70%"></div>
        <div class="skeleton" style="width: 45%"></div>
      </div>

      <span class="spec-card__title">加载中</span>
      <div>
        <button class="btn btn--primary btn--sm" style="gap: 8px">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="1.6">
            <circle cx="7" cy="7" r="5" stroke-opacity="0.4" />
            <path d="M12 7a5 5 0 0 0-5-5" stroke-linecap="round" />
          </svg>
          提交中…
        </button>
      </div>
    </div>

    <!-- 栏 3：Toast / 校验 / 二次确认 -->
    <div class="spec-card" style="flex: 1 1 0">
      <span class="spec-card__title">轻提示 Toast</span>
      <div class="toast toast--success">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.5 7.5l3 3 6-6" />
        </svg>
        笔记已保存
      </div>
      <div class="toast toast--error">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <circle cx="7" cy="7" r="5.4" />
          <path d="M7 4.2v3.4M7 9.6h.01" />
        </svg>
        模型调用失败，请稍后重试
      </div>

      <span class="spec-card__title">表单校验</span>
      <div class="input input--error">未命名项目</div>
      <span class="field__error">项目名称不能为空，且不超过 30 个字符</span>

      <span class="spec-card__title">二次确认</span>
      <div style="border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 10px">
        <span class="t-body">删除「Aura 工作台改版」？项目下的会话与笔记将一并移除，且不可恢复。</span>
        <div style="display: flex; justify-content: flex-end; gap: 8px">
          <button class="btn btn--ghost btn--sm">取消</button>
          <button class="btn btn--danger btn--sm">确认删除</button>
        </div>
      </div>
    </div>
  </div>
</section>
