<!--# title: 13 角色管理 · 方案B -->
<!--# desc: 角色卡片网格 + 权限矩阵 -->
<!--# body: data-setnav="roles" -->
<section class="screen">
  <!-- @include setnav-b.html -->

  <main class="main">
    <div class="page-head">
      <div class="page-head__text">
        <span class="t-title">角色管理</span>
        <span class="t-body t-muted">定义权限集合，并分配给系统成员</span>
      </div>
      <button class="btn btn--primary">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round">
          <path d="M7 1.5v11M1.5 7h11" />
        </svg>
        新增角色
      </button>
    </div>

    <div class="filters" style="align-items: center">
      <div class="search" style="width: 240px; height: 34px; background: var(--surface)">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4">
          <circle cx="6" cy="6" r="4.2" /><path d="M9.2 9.2 12.5 12.5" stroke-linecap="round" />
        </svg>
        搜索角色名称
      </div>
      <div class="filter" style="height: 34px; color: var(--ink)">
        全部类型
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="#6b7785" stroke-width="1.4" stroke-linecap="round">
          <path d="M3.5 5.5 7 9l3.5-3.5" />
        </svg>
      </div>
    </div>

    <div style="display: flex; gap: 16px">
      <div style="width: 264px; padding: 16px; border: 1px solid var(--line); border-radius: var(--r-xl); background: var(--surface); display: flex; flex-direction: column; gap: 8px">
        <div class="row-between">
          <span class="t-h3">管理员</span>
          <span class="pill pill--sm pill--info">系统内置</span>
        </div>
        <span class="t-sm t-muted">拥有全部模块的配置、管理与成员权限</span>
        <span class="t-sm w-semi">8 位成员</span>
        <span class="t-sm t-muted">项目读写 · 笔记读写 · 模型配置 · 用户管理</span>
      </div>

      <div style="width: 264px; padding: 16px; border: 1px solid var(--line); border-radius: var(--r-xl); background: var(--surface); display: flex; flex-direction: column; gap: 8px">
        <div class="row-between">
          <span class="t-h3">编辑者</span>
          <span class="pill pill--sm pill--archived">自定义</span>
        </div>
        <span class="t-sm t-muted">可推进项目与沉淀笔记，不能改动系统配置</span>
        <span class="t-sm w-semi">12 位成员</span>
        <span class="t-sm t-muted">项目读写 · 笔记读写 · 模型只读</span>
      </div>

      <div style="width: 264px; padding: 16px; border: 1px solid var(--line); border-radius: var(--r-xl); background: var(--surface); display: flex; flex-direction: column; gap: 8px">
        <div class="row-between">
          <span class="t-h3">只读成员</span>
          <span class="pill pill--sm pill--archived">自定义</span>
        </div>
        <span class="t-sm t-muted">仅可浏览项目与笔记内容，不参与编辑</span>
        <span class="t-sm w-semi">6 位成员</span>
        <span class="t-sm t-muted">项目只读 · 笔记只读</span>
      </div>

      <div style="width: 264px; padding: 16px; border: 1px solid var(--line); border-radius: var(--r-xl); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 150px">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#2266d1" stroke-width="1.6" stroke-linecap="round">
          <path d="M9 2v14M2 9h14" />
        </svg>
        <span class="t-body t-primary w-medium">新建自定义角色</span>
      </div>
    </div>

    <div class="spec-card">
      <div style="display: flex; align-items: center; gap: 10px">
        <span class="section-title">权限矩阵</span>
        <span class="t-sm t-muted">勾选即授予该角色对应权限，系统内置角色不可取消基础权限</span>
      </div>

      <div class="mhead">
        <span style="width: 320px; padding-left: 12px">权限项</span>
        <span style="width: 180px; text-align: center">管理员</span>
        <span style="width: 180px; text-align: center">编辑者</span>
        <span class="cell-grow" style="text-align: center">只读成员</span>
      </div>

      <div class="mrow">
        <span style="width: 320px; padding-left: 12px">项目读写</span>
        <span style="width: 180px; text-align: center" class="t-primary w-semi">✓</span>
        <span style="width: 180px; text-align: center" class="t-primary w-semi">✓</span>
        <span class="cell-grow" style="text-align: center; color: #c6cfd8">–</span>
      </div>

      <div class="mrow">
        <span style="width: 320px; padding-left: 12px">笔记读写</span>
        <span style="width: 180px; text-align: center" class="t-primary w-semi">✓</span>
        <span style="width: 180px; text-align: center" class="t-primary w-semi">✓</span>
        <span class="cell-grow t-primary w-semi" style="text-align: center">✓</span>
      </div>

      <div class="mrow">
        <span style="width: 320px; padding-left: 12px">模型配置</span>
        <span style="width: 180px; text-align: center" class="t-primary w-semi">✓</span>
        <span style="width: 180px; text-align: center; color: #c6cfd8">–</span>
        <span class="cell-grow" style="text-align: center; color: #c6cfd8">–</span>
      </div>

      <div class="mrow">
        <span style="width: 320px; padding-left: 12px">成员与角色管理</span>
        <span style="width: 180px; text-align: center" class="t-primary w-semi">✓</span>
        <span style="width: 180px; text-align: center; color: #c6cfd8">–</span>
        <span class="cell-grow" style="text-align: center; color: #c6cfd8">–</span>
      </div>
    </div>
  </main>
</section>
