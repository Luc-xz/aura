<!--# title: 02 注册 · 方案A -->
<!--# desc: 与登录同构，四个字段：用户名 / 邮箱 / 密码 / 确认密码 -->
<!--# body: data-page="register" -->
<section class="screen">
  <div class="auth">
    <div class="auth__brand">
      <div class="auth__logo">
        <div class="auth__logo-mark">
          <svg width="16" height="16" viewBox="0 0 18 18" fill="none">
            <path d="M9 2.5 3.2 15.5h11.6L9 2.5Z" fill="#fff" />
          </svg>
        </div>
        Aura
      </div>

      <h1 class="auth__headline">把项目推进的<br />每个结论留在这里</h1>
      <p class="auth__sub">
        注册后即可创建项目、与模型协作推进，并把关键结论沉淀为<br />可复用的笔记。
      </p>

      <div class="auth__preview">
        <div class="auth__preview-rail">
          <span class="auth__preview-dot auth__preview-dot--first"></span>
          <span class="auth__preview-dot"></span>
          <span class="auth__preview-dot"></span>
          <span class="auth__preview-dot"></span>
        </div>
        <div class="auth__preview-body">
          <div class="auth__preview-row auth__preview-row--head" style="width: 62%"></div>
          <div class="auth__preview-row" style="height: 44px"></div>
          <div class="auth__preview-row auth__preview-row--accent" style="height: 44px"></div>
          <div class="auth__preview-row" style="flex: 1 1 auto"></div>
        </div>
      </div>

      <p class="auth__caption">Aura Workspace · 项目工作台入口</p>
    </div>

    <div class="auth__panel">
      <form class="auth__card" onsubmit="return false">
        <div class="auth__intro">
          <span class="auth__title">注册 Aura</span>
          <span class="t-sm t-muted">创建账户，开始你的第一个项目</span>
        </div>

        <div class="field">
          <span class="field__label">用户名</span>
          <div class="input">
            <svg class="input-icon" width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4">
              <circle cx="9" cy="6.4" r="3" />
              <path d="M3.6 15c.6-2.6 2.8-4 5.4-4s4.8 1.4 5.4 4" />
            </svg>
            请输入用户名
          </div>
        </div>

        <div class="field">
          <span class="field__label">邮箱</span>
          <div class="input">
            <svg class="input-icon" width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4">
              <rect x="2.5" y="4" width="13" height="10" rx="2" />
              <path d="M2.9 4.6 9 9.6l6.1-5" />
            </svg>
            请输入邮箱
          </div>
        </div>

        <div class="field">
          <span class="field__label">密码</span>
          <div class="input">
            <svg class="input-icon" width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4">
              <rect x="3.5" y="8" width="11" height="7" rx="2" />
              <path d="M6.2 8V6.2a2.8 2.8 0 0 1 5.6 0V8" />
            </svg>
            请输入密码
          </div>
        </div>

        <div class="field">
          <span class="field__label">确认密码</span>
          <div class="input">
            <svg class="input-icon" width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4">
              <rect x="3.5" y="8" width="11" height="7" rx="2" />
              <path d="M6.2 8V6.2a2.8 2.8 0 0 1 5.6 0V8" />
            </svg>
            请再次输入密码
          </div>
        </div>

        <button class="btn btn--primary" style="height: 38px; width: 100%; justify-content: center">注册</button>

        <span class="auth__foot">已有账户？<span class="t-primary w-medium"> 去登录</span></span>
      </form>
    </div>
  </div>
</section>
