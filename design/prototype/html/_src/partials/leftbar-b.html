<!-- 方案 B · 左栏（280px）：品牌 + 模块导航 + 项目列表 + 用户栏 -->
<aside class="col-left">
  <div class="brand">
    <div class="brand__logo">
      <svg width="14" height="14" viewBox="0 0 18 18" fill="none">
        <path d="M9 2.5 3.2 15.5h11.6L9 2.5Z" fill="#fff" />
      </svg>
    </div>
    <span class="brand__name">Aura</span>
    <span class="brand__tag">自主体验</span>
  </div>

  <div class="modnav modnav--row">
    <div class="modnav__item" data-key="chat">
      <svg class="nav-icon" viewBox="0 0 18 18" style="width:13px;height:13px">
        <rect x="2.5" y="2.5" width="5.2" height="5.2" rx="1.2" />
        <rect x="10.3" y="2.5" width="5.2" height="5.2" rx="1.2" />
        <rect x="2.5" y="10.3" width="5.2" height="5.2" rx="1.2" />
        <rect x="10.3" y="10.3" width="5.2" height="5.2" rx="1.2" />
      </svg>
      工作台
    </div>
    <div class="modnav__item" data-key="notes">
      <svg class="nav-icon" viewBox="0 0 18 18" style="width:13px;height:13px">
        <path d="M5 2.5h6l3 3v10H5z" />
        <path d="M11 2.5v3h3" />
      </svg>
      笔记
    </div>
    <div class="modnav__item" data-key="setting">
      <svg class="nav-icon" viewBox="0 0 18 18" style="width:13px;height:13px">
        <circle cx="9" cy="9" r="2.6" />
        <path d="M9 2.2v2M9 13.8v2M2.2 9h2M13.8 9h2" />
      </svg>
      设置
    </div>
  </div>

  <div class="divider"></div>
  <div class="group-title">项目</div>

  <div class="search">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4">
      <circle cx="6" cy="6" r="4.2" />
      <path d="M9.2 9.2 12.5 12.5" stroke-linecap="round" />
    </svg>
    搜索项目
  </div>

  <div class="project-list">
    <div class="project-item project-item--active">
      <span class="project-item__name">品牌官网改版</span>
      <span class="project-item__meta">进行中 · 2 小时前</span>
    </div>
    <div class="project-item">
      <span class="project-item__name">Aura 前端工作台改造</span>
      <span class="project-item__meta">进行中 · 昨天 18:20</span>
    </div>
    <div class="project-item">
      <span class="project-item__name">用户增长实验</span>
      <span class="project-item__meta">暂停 · 3 天前</span>
    </div>
    <div class="project-item">
      <span class="project-item__name">客服知识库搭建</span>
      <span class="project-item__meta">进行中 · 上周</span>
    </div>
    <div class="project-item">
      <span class="project-item__name">数据看板重构</span>
      <span class="project-item__meta">暂停 · 2 周前</span>
    </div>
    <div class="project-item">
      <span class="project-item__name">2025 Q4 复盘</span>
      <span class="project-item__meta">已归档 · 1 个月前</span>
    </div>
  </div>

  <div class="user-bar">
    <div class="user-bar__avatar">
      <svg class="nav-icon" viewBox="0 0 18 18" style="width:14px;height:14px;stroke-width:1.6">
        <circle cx="9" cy="6.4" r="3" />
        <path d="M3.6 15c.6-2.6 2.8-4 5.4-4s4.8 1.4 5.4 4" />
      </svg>
    </div>
    <span class="user-bar__name">yanqing</span>
    <svg class="nav-icon" viewBox="0 0 18 18" style="width:14px;height:14px;margin-left:auto;color:#8a97a3">
      <path d="M7 3h6.5v12H7" />
      <path d="M4 9h7M8.5 6 11.5 9l-3 3" />
    </svg>
  </div>
</aside>
